name: Contract bytecode build
on:
  workflow_dispatch:
  pull_request:
    paths: ['contracts/**', 'server/agency-release.mjs', 'scripts/verify-agency-binary.mjs', 'scripts/verify-contract-candidate.mjs', 'scripts/check-mainnet-build-identity.sh', 'scripts/build-mainnet-contract.sh', 'config/contract-build-candidates.json', '.github/workflows/contracts.yml']
  push:
    branches: [main]
    paths: ['contracts/**', 'server/agency-release.mjs', 'scripts/verify-agency-binary.mjs', 'scripts/verify-contract-candidate.mjs', 'scripts/check-mainnet-build-identity.sh', 'scripts/build-mainnet-contract.sh', 'config/contract-build-candidates.json', '.github/workflows/contracts.yml']
permissions:
  contents: read
concurrency:
  group: contract-bytecode-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bytecode:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/funded-fee-router
      - name: Install checksum-verified Agave 4.1.2 build tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/funded-agave"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/funded-agave/agave.tar.bz2" https://github.com/anza-xyz/agave/releases/download/v4.1.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          printf '%s  %s\n' '5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770' "$RUNNER_TEMP/funded-agave/agave.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/funded-agave/agave.tar.bz2" -C "$RUNNER_TEMP/funded-agave"
      - name: Build pinned SBF v0 bytecode
        working-directory: contracts/funded-fee-router
        run: 'CARGO_TARGET_DIR="$RUNNER_TEMP/router-build" "$RUNNER_TEMP/funded-agave/solana-release/bin/cargo-build-sbf" --manifest-path programs/funded-fee-router/Cargo.toml --arch v0 --tools-version v1.54 --sbf-out-dir "$PWD/target/deploy" -- --locked'
      - name: Verify production identity and recovery guards
        run: bash scripts/check-mainnet-build-identity.sh
      - name: Build developer token lock bytecode
        working-directory: contracts/funded-fee-router
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/escrow-build" "$RUNNER_TEMP/funded-agave/solana-release/bin/cargo-build-sbf" --manifest-path programs/developer-token-lock/Cargo.toml --arch v0 --tools-version v1.53 --sbf-out-dir "$PWD/target/deploy" -- --locked
      - name: Build Devnet agency bytecode
        working-directory: contracts/funded-fee-router
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/agency-build" "$RUNNER_TEMP/funded-agave/solana-release/bin/cargo-build-sbf" --manifest-path programs/funded-fee-router/Cargo.toml --features devnet-v3-program --arch v0 --tools-version v1.54 --sbf-out-dir "$PWD/target/deploy/devnet-v3" -- --locked
      - name: Build production feature with a test-only program identity
        working-directory: contracts/funded-fee-router
        # This public fixture has no deployment signer. It verifies the production
        # feature independently of Devnet; it is not a deployable release artifact.
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_STRIP: 'true'
          FUNDED_MAINNET_PROGRAM_ID: 3qbR1eZRqXUWroWKKYhbDmR3FfqTHfqSU8zZSxtANzYh
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/mainnet-build-check-build" "$RUNNER_TEMP/funded-agave/solana-release/bin/cargo-build-sbf" --manifest-path programs/funded-fee-router/Cargo.toml --features mainnet-v3-program --arch v0 --tools-version v1.54 --sbf-out-dir "$PWD/target/deploy/mainnet-build-check" -- --locked
      - name: Verify candidates without changing deployed program trust
        run: |
          node scripts/verify-contract-candidate.mjs contracts/funded-fee-router/target/deploy/devnet-v3/funded_fee_router.so devnet
          node scripts/verify-contract-candidate.mjs contracts/funded-fee-router/target/deploy/mainnet-build-check/funded_fee_router.so productionBuildCheck
      - name: Verify account setup and custody against compiled bytecode
        working-directory: contracts/funded-fee-router
        run: |
          DEVELOPER_LOCK_TEST_SO="$PWD/target/deploy/developer_token_lock.so" cargo test --locked -p developer-token-lock --test app_account_setup
          FUNDED_ROUTER_TEST_SO="$PWD/target/deploy/funded_fee_router.so" cargo test --locked -p funded-fee-router --test app_account_setup
          LEGACY_DEVELOPER_LOCK_TEST_SO="$PWD/target/deploy/developer_token_lock.so" FUNDED_ROUTER_TEST_SO="$PWD/target/deploy/funded_fee_router.so" cargo test --locked -p funded-fee-router --test developer_escrow
          FUNDED_ROUTER_TEST_SO="$PWD/target/deploy/devnet-v3/funded_fee_router.so" cargo test --locked -p funded-fee-router --features devnet-v3-program --test app_account_setup
          LEGACY_DEVELOPER_LOCK_TEST_SO="$PWD/target/deploy/developer_token_lock.so" FUNDED_ROUTER_TEST_SO="$PWD/target/deploy/devnet-v3/funded_fee_router.so" cargo test --locked -p funded-fee-router --features devnet-v3-program --test developer_escrow
          FUNDED_MAINNET_PROGRAM_ID=3qbR1eZRqXUWroWKKYhbDmR3FfqTHfqSU8zZSxtANzYh FUNDED_ROUTER_TEST_SO="$PWD/target/deploy/mainnet-build-check/funded_fee_router.so" cargo test --locked -p funded-fee-router --features mainnet-v3-program --test app_account_setup
          FUNDED_MAINNET_PROGRAM_ID=3qbR1eZRqXUWroWKKYhbDmR3FfqTHfqSU8zZSxtANzYh LEGACY_DEVELOPER_LOCK_TEST_SO="$PWD/target/deploy/developer_token_lock.so" FUNDED_ROUTER_TEST_SO="$PWD/target/deploy/mainnet-build-check/funded_fee_router.so" cargo test --locked -p funded-fee-router --features mainnet-v3-program --test developer_escrow
      - name: Record source and bytecode hashes
        working-directory: contracts/funded-fee-router
        run: |
          git rev-parse HEAD > target/deploy/source-revision.txt
          sha256sum target/deploy/funded_fee_router.so > target/deploy/bytecode.sha256
          sha256sum target/deploy/developer_token_lock.so >> target/deploy/bytecode.sha256
          sha256sum target/deploy/devnet-v3/funded_fee_router.so >> target/deploy/bytecode.sha256
          sha256sum target/deploy/mainnet-build-check/funded_fee_router.so >> target/deploy/bytecode.sha256
          wc -c target/deploy/funded_fee_router.so target/deploy/developer_token_lock.so target/deploy/devnet-v3/funded_fee_router.so target/deploy/mainnet-build-check/funded_fee_router.so > target/deploy/bytecode-sizes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-bytecode-${{ github.sha }}
          path: |
            contracts/funded-fee-router/target/deploy/funded_fee_router.so
            contracts/funded-fee-router/target/deploy/developer_token_lock.so
            contracts/funded-fee-router/target/deploy/devnet-v3/funded_fee_router.so
            contracts/funded-fee-router/target/deploy/mainnet-build-check/funded_fee_router.so
            contracts/funded-fee-router/target/deploy/source-revision.txt
            contracts/funded-fee-router/target/deploy/bytecode.sha256
            contracts/funded-fee-router/target/deploy/bytecode-sizes.txt
          retention-days: 30
