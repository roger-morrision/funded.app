name: Application checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, master, 'enhance/**', 'enhancements/**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify architecture environment validation
        run: >-
          node --input-type=module -e "import('./src/lib/env.js').then(({ validateRuntimeEnv }) => validateRuntimeEnv({ VITE_SOLANA_CLUSTER: 'devnet', VITE_API_BASE_URL: '/', VITE_ALLOW_MAINNET: 'false' })).then(() => console.log('env ok'))"
      - run: npm run check
      - name: Verify app-owned token account setup
        run: node --test tests/app-account-setup.test.mjs tests/program-deploy-cost.test.mjs tests/merged-escrow.test.mjs tests/mainnet-preparation.test.mjs tests/devnet-metadata.test.mjs
      - run: npm run build
        env:
          VITE_API_BASE_URL: /
          VITE_SOLANA_CLUSTER: devnet
          VITE_ALLOW_MAINNET: 'false'
      - run: npm run release:manifest
        env:
          VITE_SOLANA_CLUSTER: devnet
          VITE_ALLOW_MAINNET: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-devnet-build-${{ github.sha }}
          path: dist/
          retention-days: 14
  docker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FUNDED_CI_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      FUNDED_CI_NODE_IMAGE: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the exact revision with restrictive source permissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FUNDED_CI_REVISION"
          # Reproduce private archive modes; the runtime must still read these.
          chmod 700 server scripts db
          chmod 600 server/index.mjs scripts/migrate-postgres.mjs db/schema.sql
          build_args=(--build-arg "NODE_IMAGE=$FUNDED_CI_NODE_IMAGE" --build-arg "FUNDED_SOURCE_REVISION=$FUNDED_CI_REVISION")
          if [ -n "${CODEX_PROXY_CERT:-}" ]; then
            build_args+=(--secret "id=proxy_ca,src=$CODEX_PROXY_CERT")
          fi
          docker build "${build_args[@]}" --tag "funded-ci:$FUNDED_CI_REVISION" .
