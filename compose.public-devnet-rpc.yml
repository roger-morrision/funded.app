# Optional funded.vip QA overlay for an exhausted private Devnet RPC quota.
# Append after the normal release overlays. Existing secret files stay intact.
# This selects the official public endpoint; it does not remove its rate limits.
# The normal funded.vip release pins and all finalized V3 checks still apply.
services:
  app:
    environment:
      SOLANA_CLUSTER: devnet
      SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_HOLDER_INDEX_RPC_URL: https://api.devnet.solana.com
      FUNDED_PROGRAM_EVIDENCE_RPC_URL: https://api.devnet.solana.com
  x-post-worker:
    environment:
      SOLANA_CLUSTER: devnet
      SOLANA_RPC_URL: https://api.devnet.solana.com
      FUNDED_PROGRAM_EVIDENCE_RPC_URL: https://api.devnet.solana.com
