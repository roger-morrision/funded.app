# Explicit opt-in Devnet automatic-reward worker. The shared ledger lets the app
# publish only real schedules and current worker readiness. Never use Mainnet
# credentials with this profile.
services:
  reward-volume-init:
    profiles: ["automatic-rewards"]
    image: ${FUNDED_APP_IMAGE:-fundedapp-app:automatic-rewards-v11-20260923h}
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown -R node:node /app/data/automatic-rewards"]
    volumes:
      - funded_reward_ledger:/app/data/automatic-rewards

  app:
    environment:
      AUTOMATIC_REWARD_STORE_PATH: /app/data/automatic-rewards/ledger.json
    volumes:
      - funded_reward_ledger:/app/data/automatic-rewards
    depends_on:
      reward-volume-init:
        condition: service_completed_successfully

volumes:
  funded_reward_ledger:
