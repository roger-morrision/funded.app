[package]
name = "funded-fee-router"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "funded_fee_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = "=1.2.0"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "5.0.0"
solana-transaction = "5.0.0"
solana-signer = "4.0.0"
solana-keypair = "4.0.0"
solana-account = "4.7.0"
# LiteSVM 0.17 accepts Solana 4/3 transaction, message, and signer types.
solana-message-lite = { package = "solana-message", version = "4.6.0" }
solana-transaction-lite = { package = "solana-transaction", version = "4.3.0", features = ["wincode"] }
solana-signer-lite = { package = "solana-signer", version = "3.0.1" }
solana-keypair-lite = { package = "solana-keypair", version = "3.1.2" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
