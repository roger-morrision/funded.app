[package]
name = "developer-token-lock"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "developer_token_lock"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = "=1.2.0"

[dev-dependencies]
litesvm = "0.17.0"
solana-account = "4.7.0"
solana-message-lite = { package = "solana-message", version = "4.6.0" }
solana-transaction-lite = { package = "solana-transaction", version = "4.3.0", features = ["wincode"] }
solana-signer-lite = { package = "solana-signer", version = "3.0.1" }
solana-keypair-lite = { package = "solana-keypair", version = "3.1.2" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
