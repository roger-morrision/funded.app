<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1840" viewBox="0 0 1600 1840" role="img" aria-labelledby="title description">
  <title id="title">funded.vip animated capital flow</title>
  <desc id="description">Animated Devnet policy map. A launch pays a separate SOL service fee, optional promotion burns FUNDED, and a launched-coin reserve supports a later migration claim. Trading generates Pump creator fees that are collected by a per-mint V3 router, then require creator approval and funding. Current gross fee shares are 80 percent creator-directed, 8 percent operations, 1 percent referrals, 4 percent Daily bonus, and 5 percent FUNDED buyback. The separate 2 percent AI agency budget is included in the shared allocation pool. Only 8 percent is the app allocation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102d3c"/><stop offset="0.52" stop-color="#071b28"/><stop offset="1" stop-color="#091a2c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163746"/><stop offset="1" stop-color="#0b2432"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow-sol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#53ded8" stroke-width="1.8"/></marker>
    <marker id="arrow-funded" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffc56a" stroke-width="1.8"/></marker>
    <marker id="arrow-coin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b5a1ff" stroke-width="1.8"/></marker>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.title{font-size:66px;letter-spacing:-2px;font-weight:900;fill:#eef8ff}.subtitle{font-size:22px;fill:#aac4d0}.brand{font-size:26px;font-weight:900;fill:#eef8ff}.brand-accent{fill:#53ded8}.section-label{font-size:16px;font-weight:900;letter-spacing:2.5px;fill:#53ded8}.section-title{font-size:29px;font-weight:800;fill:#eaf6ff}.small{font-size:17px;fill:#bcd0da}.tiny{font-size:14px;fill:#9bb8c5}.node-title{font-size:24px;font-weight:800;fill:#f2faff}.node-copy{font-size:17px;fill:#bad0db}.metric{font-size:57px;font-weight:900;fill:#53ded8}.metric-small{font-size:31px;font-weight:900;fill:#c7f875}.gold{fill:#ffc56a}.violet{fill:#b5a1ff}.sol-line{fill:none;stroke:#53ded8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-sol);stroke-dasharray:11 11;animation:flow 1.2s linear infinite}.funded-line{fill:none;stroke:#ffc56a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-funded);stroke-dasharray:11 11;animation:flow 1.2s linear infinite}.coin-line{fill:none;stroke:#b5a1ff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-coin);stroke-dasharray:11 11;animation:flow 1.2s linear infinite}.future-line{fill:none;stroke:#bd9a65;stroke-width:3;stroke-dasharray:7 9;marker-end:url(#arrow-funded);animation:flow 1.4s linear infinite}.sol-packet{fill:#7bfff5;filter:url(#glow)}.funded-packet{fill:#ffd487;filter:url(#glow)}.coin-packet{fill:#cfbfff;filter:url(#glow)}.panel{fill:url(#panel);stroke:#386072;stroke-width:2}.node{fill:#0a2533;stroke:#477080;stroke-width:2}.node-gold{fill:#2b2a25;stroke:#927449;stroke-width:2}.node-coin{fill:#23263e;stroke:#766fa8;stroke-width:2}.route-title{font-size:20px;font-weight:800;fill:#e7f6fc}.dash-card{fill:#282a29;stroke:#a68a61;stroke-width:2;stroke-dasharray:9 7}.badge{font-size:14px;font-weight:900;letter-spacing:1px;fill:#0d2731}.number{font-size:22px;font-weight:900;fill:#06232b}.note{font-size:15px;fill:#a9c0cb}@keyframes flow{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){.sol-line,.funded-line,.coin-line,.future-line{animation:none}.packet{display:none}}
  </style>

  <rect width="1600" height="1840" fill="url(#background)"/><rect width="1600" height="1840" fill="url(#grid)"/>
  <text x="65" y="70" class="brand">funded<tspan class="brand-accent">.vip</tspan></text>
  <rect x="1265" y="42" width="270" height="40" rx="20" fill="#113a41" stroke="#3baaa9"/><text x="1400" y="68" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1.3" fill="#6df3e8">DEVNET POLICY MAP</text>
  <text x="65" y="158" class="title">Follow the capital.</text>
  <text x="65" y="195" class="subtitle">Three assets, separate routes, and receipts at every completed step.</text>
  <g transform="translate(65 223)"><circle r="8" cx="8" cy="8" fill="#53ded8"/><text x="26" y="15" class="small">SOL</text><circle r="8" cx="127" cy="8" fill="#ffc56a"/><text x="145" y="15" class="small">$FUNDED</text><circle r="8" cx="300" cy="8" fill="#b5a1ff"/><text x="318" y="15" class="small">Launched coin</text><text x="555" y="15" class="tiny">Moving dots show intended transfer direction; finality and eligibility still govern execution.</text></g>

  <!-- 1. Launch cash and token routes -->
  <rect class="panel" x="60" y="270" width="1480" height="320" rx="29"/>
  <rect x="95" y="299" width="51" height="51" rx="15" fill="#53ded8"/><text x="120.5" y="332" text-anchor="middle" class="number">01</text>
  <text x="165" y="321" class="section-label">AT COIN LAUNCH</text><text x="165" y="354" class="section-title">Creator capital takes three independent routes</text>
  <rect class="node" x="100" y="407" width="278" height="125" rx="20"/><text x="124" y="449" class="node-title">Creator wallet</text><text x="124" y="479" class="node-copy">Signs launch and funds</text><text x="124" y="504" class="node-copy">the selected package.</text>
  <path class="sol-line" d="M378 431 C470 431 500 410 583 410"/>
  <path class="funded-line" d="M378 469 C473 469 502 488 583 488"/>
  <path class="coin-line" d="M378 510 C503 565 630 562 794 554 S990 525 1054 525"/>
  <circle class="packet sol-packet" r="7"><animateMotion dur="3s" repeatCount="indefinite" path="M378 431 C470 431 500 410 583 410"/></circle>
  <circle class="packet funded-packet" r="7"><animateMotion dur="3.5s" repeatCount="indefinite" path="M378 469 C473 469 502 488 583 488"/></circle>
  <circle class="packet coin-packet" r="7"><animateMotion dur="5s" repeatCount="indefinite" path="M378 510 C503 565 630 562 794 554 S990 525 1054 525"/></circle>
  <rect class="node" x="595" y="376" width="420" height="77" rx="17"/><text x="620" y="408" class="route-title">0.02 SOL → service treasury</text><text x="620" y="434" class="tiny">Default fee for every launch; separate from creator fees.</text>
  <rect class="node-gold" x="595" y="463" width="420" height="77" rx="17"/><text x="620" y="495" class="route-title">Pro / Premier → $FUNDED burn</text><text x="620" y="521" class="tiny">Optional quoted promotion; burned in creation tx.</text>
  <rect class="node-coin" x="1065" y="463" width="425" height="77" rx="17"/><text x="1090" y="495" class="route-title">Launched coin → reserve vault</text><text x="1090" y="521" class="tiny">3–50% of supply; custody requires proof.</text>
  <text x="1063" y="423" class="small">Standard / Pro / Premier</text><text x="1063" y="446" class="tiny">Package posts depend on active X publishing.</text>

  <!-- 2. Creator-fee collection -->
  <rect class="panel" x="60" y="622" width="1480" height="785" rx="29"/>
  <rect x="95" y="653" width="51" height="51" rx="15" fill="#53ded8"/><text x="120.5" y="686" text-anchor="middle" class="number">02</text>
  <text x="165" y="675" class="section-label">AS THE COIN TRADES</text><text x="165" y="708" class="section-title">Gross collected creator fees are allocated by saved mint policy</text>
  <rect class="node" x="96" y="751" width="270" height="112" rx="18"/><text x="120" y="790" class="node-title">Verified trades</text><text x="120" y="820" class="node-copy">Pump creator fees</text><text x="120" y="844" class="node-copy">accrue for the mint.</text>
  <rect class="node" x="446" y="751" width="270" height="112" rx="18"/><text x="470" y="790" class="node-title">Fee collection</text><text x="470" y="820" class="node-copy">Per-mint vault →</text><text x="470" y="844" class="node-copy">verified V3 router.</text>
  <rect class="node" x="796" y="751" width="270" height="112" rx="18"/><text x="820" y="790" class="node-title">Creator review</text><text x="820" y="820" class="node-copy">Signs settlement and</text><text x="820" y="844" class="node-copy">needed funding actions.</text>
  <rect class="node" x="1146" y="751" width="294" height="112" rx="18"/><text x="1170" y="790" class="node-title">Allocation &amp; funding</text><text x="1170" y="820" class="node-copy">Saved policy routes</text><text x="1170" y="844" class="node-copy">to approved vaults.</text>
  <path class="sol-line" d="M366 807 H436"/><path class="sol-line" d="M716 807 H786"/><path class="sol-line" d="M1066 807 H1136"/>
  <circle class="packet sol-packet" r="7"><animateMotion dur="2s" repeatCount="indefinite" path="M366 807 H436"/></circle>
  <circle class="packet sol-packet" r="7"><animateMotion dur="2s" begin=".5s" repeatCount="indefinite" path="M716 807 H786"/></circle>
  <circle class="packet sol-packet" r="7"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M1066 807 H1136"/></circle>
  <text x="98" y="902" class="small">After settlement, the current default gross-fee split is:</text>
  <path class="sol-line" d="M1293 863 V922 H388 V954"/><path class="sol-line" d="M1293 863 V922 H1197 V954"/>
  <circle class="packet sol-packet" r="7"><animateMotion dur="4.2s" repeatCount="indefinite" path="M1293 863 V922 H388 V954"/></circle>
  <circle class="packet sol-packet" r="7"><animateMotion dur="2.8s" begin="1s" repeatCount="indefinite" path="M1293 863 V922 H1197 V954"/></circle>
  <rect class="node" x="96" y="967" width="630" height="360" rx="23"/>
  <text x="125" y="1036" class="metric">80%</text><text x="312" y="1035" class="node-title">Creator-directed SOL</text>
  <text x="125" y="1072" class="small">Creator chooses the saved split across:</text>
  <rect x="125" y="1093" width="560" height="57" rx="13" fill="#18424e"/><text x="147" y="1129" class="route-title">Creator wallet · signed payout</text>
  <rect x="125" y="1161" width="560" height="57" rx="13" fill="#18424e"/><text x="147" y="1197" class="route-title">Coin holders · eligible automatic SOL</text>
  <rect x="125" y="1229" width="560" height="57" rx="13" fill="#18424e"/><text x="147" y="1265" class="route-title">Named X account · verified claim</text>
  <text x="125" y="1309" class="tiny">Each recipient path needs its own funding and final payment proof.</text>
  <rect class="node" x="772" y="967" width="668" height="360" rx="23"/>
  <text x="801" y="1036" class="metric">20%</text><text x="990" y="1035" class="node-title">Shared allocations</text>
  <rect x="801" y="1093" width="295" height="89" rx="13" fill="#163745"/><text x="823" y="1130" class="metric-small">8%</text><text x="882" y="1129" class="route-title">Operations</text><text x="823" y="1159" class="tiny">App operations &amp; marketing</text>
  <rect x="1112" y="1093" width="297" height="89" rx="13" fill="#163745"/><text x="1134" y="1130" class="metric-small">1%</text><text x="1193" y="1129" class="route-title">Referrals</text><text x="1134" y="1159" class="tiny">Qualified three-level uplines</text>
  <rect x="801" y="1193" width="295" height="89" rx="13" fill="#163745"/><text x="823" y="1230" class="metric-small">4%</text><text x="882" y="1229" class="route-title">Daily bonus</text><text x="823" y="1259" class="tiny">Creators, referrers, traders</text>
  <rect x="1112" y="1193" width="297" height="89" rx="13" fill="#283227" stroke="#718d48"/><text x="1134" y="1230" class="metric-small">5%</text><text x="1193" y="1229" class="route-title">Buyback</text><text x="1134" y="1259" class="tiny">SOL → $FUNDED → burn</text>
  <text x="801" y="1309" class="tiny">Includes 2% AI agents. Only 8% is app Operations &amp; marketing.</text>
  <text x="98" y="1370" class="tiny">Percentages are of gross creator fees actually collected, not trading volume or app service charges. Existing mints retain saved rates.</text>

  <!-- 3. Migration token route -->
  <rect class="panel" x="60" y="1439" width="1480" height="184" rx="29"/>
  <rect x="95" y="1464" width="51" height="51" rx="15" fill="#b5a1ff"/><text x="120.5" y="1497" text-anchor="middle" class="number">03</text>
  <text x="165" y="1484" class="section-label violet">AT MIGRATION</text><text x="165" y="1518" class="section-title">Reserved launched coins can reach eligible $FUNDED holders</text>
  <rect class="node-coin" x="100" y="1545" width="310" height="56" rx="15"/><text x="123" y="1581" class="route-title">Verified reserve custody</text>
  <rect class="node-coin" x="627" y="1545" width="335" height="56" rx="15"/><text x="650" y="1581" class="route-title">Snapshot + proof gate</text>
  <rect class="node-coin" x="1177" y="1545" width="315" height="56" rx="15"/><text x="1200" y="1581" class="route-title">Eligible holder wallet</text>
  <path class="coin-line" d="M410 1573 H615"/><path class="coin-line" d="M962 1573 H1165"/>
  <circle class="packet coin-packet" r="7"><animateMotion dur="3s" repeatCount="indefinite" path="M410 1573 H615"/></circle>
  <circle class="packet coin-packet" r="7"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M962 1573 H1165"/></circle>

  <!-- Gated future policy: not an additive current flow -->
  <rect class="dash-card" x="60" y="1655" width="1480" height="125" rx="24"/>
  <rect x="90" y="1677" width="132" height="29" rx="14" fill="#624b2f"/><text x="156" y="1696" text-anchor="middle" class="badge" fill="#ffe2ae">AI AGENTS</text>
  <text x="240" y="1698" class="route-title">Included with new launches: 2% dedicated AI agent budget</text>
  <text x="92" y="1733" class="small">Included agents share 2%: buy + burn at $100k and $300k. Promotion packages add X promotion (paused).</text>
  <text x="92" y="1758" class="tiny">Existing coins keep saved rates. Actions wait for verified funding, cadence and milestones.</text>
  <text x="65" y="1815" class="note">Policy diagram, not execution proof. Collection, vault allocation, submitted signatures, and queued actions do not establish final payment or burn.</text>
</svg>
