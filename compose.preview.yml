services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: funded_app
      POSTGRES_USER: funded
      POSTGRES_PASSWORD_FILE: /run/secrets/funded_db_password
    secrets:
      - funded_db_password
    volumes:
      - funded_vip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funded -d funded_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        FUNDED_SOURCE_REVISION: ${FUNDED_BUILD_ID:-local-development}
        VITE_API_BASE_URL: /
        VITE_DEVNET_METADATA_ORIGIN: ${FUNDED_DEVNET_METADATA_ORIGIN:-https://metadata.funded.vip}
        VITE_SOLANA_CLUSTER: devnet
        VITE_EXPLORE_CLUSTER: devnet
        VITE_ALLOW_MAINNET: "false"
        VITE_JACKPOT_ENABLED: ${VITE_JACKPOT_ENABLED:-false}
        VITE_DEV_MODE: "false"
        VITE_DEV_AUTOCONNECT: "false"
        VITE_DEV_WALLET_ROLE: ${DEV_WALLET_ROLE:-creator}
        VITE_FUNDED_FEE_ROUTER_PROGRAM_ID: ${FUNDED_FEE_ROUTER_PROGRAM_ID:?Missing Devnet router ID}
        VITE_FUNDED_TRADE_FEE_OWNER: ${FUNDED_TRADE_FEE_OWNER:?Missing Devnet fee owner}
        VITE_FUNDED_TOKEN_MINT: ${FUNDED_TOKEN_MINT:-}
        VITE_FUNDED_SWAP_POOL: ${FUNDED_SWAP_POOL:-}
        VITE_FUNDED_BOOST_BURN_AMOUNT: ${VITE_FUNDED_BOOST_BURN_AMOUNT:-25000}
        VITE_FUNDED_PRO_BURN_AMOUNT: ${VITE_FUNDED_PRO_BURN_AMOUNT:-100000}
        VITE_FUNDED_PREMIER_BURN_AMOUNT: ${VITE_FUNDED_PREMIER_BURN_AMOUNT:-250000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health',{signal:AbortSignal.timeout(8000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    command: ["sh", "-c", "node scripts/migrate-postgres.mjs && node server/index.mjs"]
    environment:
      FUNDED_BUILD_ID: ${FUNDED_BUILD_ID:-local-development}
      SOLANA_CLUSTER: devnet
      DEVNET_METADATA_ORIGIN: ${FUNDED_DEVNET_METADATA_ORIGIN:-https://metadata.funded.vip}
      VITE_ALLOW_MAINNET: "false"
      NODE_ENV: production
      DEV_MODE: "false"
      DEV_WALLET_ROLE: ${DEV_WALLET_ROLE:-creator}
      SOLANA_DEVNET_CREATOR_SECRET_KEY_FILE: /run/secrets/solana_devnet_creator_secret_key
      SOLANA_KEEPER_CONFIGURED: "true"
      SOLANA_KEEPER_SECRET_KEY_FILE: /run/secrets/solana_keeper_secret_key
      FUNDED_ROUTER_AUTHORITY_SECRET_KEY_FILE: /run/secrets/funded_router_authority_secret_key
      SOLANA_REFERRAL_PAYOUT_SECRET_KEY_FILE: /run/secrets/solana_referral_payout_secret_key
      SOLANA_REFERRAL_PAYOUT_CONFIGURED: ${SOLANA_REFERRAL_PAYOUT_CONFIGURED:-false}
      MAX_REFERRAL_PAYOUT_SOL: "0.01"
      HOST: 0.0.0.0
      PORT: 8787
      VITE_SOLANA_CLUSTER: devnet
      VITE_JACKPOT_ENABLED: ${VITE_JACKPOT_ENABLED:-false}
      SOLANA_RPC_URL_FILE: /run/secrets/solana_rpc_url
      FUNDED_TOKEN_MINT: ${FUNDED_TOKEN_MINT:?Missing Devnet FUNDED mint}
      FUNDED_SWAP_POOL: ${FUNDED_SWAP_POOL:?Missing verified Devnet FUNDED pool}
      FUNDED_TRADE_FEE_OWNER: ${FUNDED_TRADE_FEE_OWNER:?Missing Devnet fee owner}
      FUNDED_BOOST_PAYMENT_WALLET: ${FUNDED_BOOST_PAYMENT_WALLET:-${FUNDED_TRADE_FEE_OWNER:?Missing Devnet boost recipient}}
      FUNDED_BOOST_ENABLED: ${FUNDED_BOOST_ENABLED:-false}
      FUNDED_PUMP_REVENUE_WALLET: ${FUNDED_PUMP_REVENUE_WALLET:-}
      FUNDED_TRADE_FEE_BPS: ${FUNDED_TRADE_FEE_BPS:-50}
      FUNDED_BUYBACK_EXECUTOR_ENABLED: ${FUNDED_BUYBACK_EXECUTOR_ENABLED:-false}
      VITE_FUNDED_TOKEN_MINT: ${FUNDED_TOKEN_MINT:?Missing Devnet FUNDED mint}
      VITE_FUNDED_BOOST_BURN_AMOUNT: ${VITE_FUNDED_BOOST_BURN_AMOUNT:-25000}
      VITE_FUNDED_PRO_BURN_AMOUNT: ${VITE_FUNDED_PRO_BURN_AMOUNT:-100000}
      VITE_FUNDED_PREMIER_BURN_AMOUNT: ${VITE_FUNDED_PREMIER_BURN_AMOUNT:-250000}
      FUNDED_FEE_ROUTER_PROGRAM_ID: ${FUNDED_FEE_ROUTER_PROGRAM_ID}
      FUNDED_REWARD_AUTHORITY: ${FUNDED_REWARD_AUTHORITY:-}
      FUNDED_LAUNCH_RESERVE_LOOKUP_TABLE: ${FUNDED_LAUNCH_RESERVE_LOOKUP_TABLE:-}
      FUNDED_REWARD_PROGRAM_DATA_SHA256: ${FUNDED_REWARD_PROGRAM_DATA_SHA256:-}
      FUNDED_COMMUNITY_RESERVE_RECEIPTS_JSON: ${FUNDED_COMMUNITY_RESERVE_RECEIPTS_JSON:-}
      FUNDED_API_TOKEN_FILE: /run/secrets/funded_api_token
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET_FILE: /run/secrets/x_client_secret
      X_CALLBACK_URL: ${X_CALLBACK_URL:-}
      X_BEARER_TOKEN_FILE: /run/secrets/x_bearer_token
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: "false"
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${FUNDED_PUBLIC_APP_URL:-https://funded.vip}
      PUBLIC_APP_URL: ${FUNDED_PUBLIC_APP_URL:-https://funded.vip}
      AUTOMATIC_REWARD_STORE_PATH: /app/data/automatic-rewards/ledger.json
    secrets:
      - funded_api_token
      - database_url
      - funded_db_password
      - solana_rpc_url
      - solana_devnet_creator_secret_key
      - solana_keeper_secret_key
      - funded_router_authority_secret_key
      - solana_referral_payout_secret_key
      - x_client_secret
      - x_bearer_token
    volumes:
      - funded_reward_ledger:/app/data/automatic-rewards
    ports:
      - "127.0.0.1:${FUNDED_PREVIEW_PORT:-8788}:8787"
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      - app

volumes:
  funded_vip_pgdata:
  funded_reward_ledger:

secrets:
  funded_api_token:
    file: ./.secrets/funded-api-token
  database_url:
    file: ./.secrets/database-url
  funded_db_password:
    file: ./.secrets/funded-db-password
  solana_rpc_url:
    file: ./.secrets/solana-rpc-url
  solana_devnet_rpc_url:
    file: ./.secrets/solana-devnet-rpc-url
  solana_holder_index_rpc_url:
    file: ./.secrets/solana-holder-index-rpc-url
  solana_devnet_creator_secret_key:
    file: ./.secrets/solana-devnet-creator-secret-key
  solana_keeper_secret_key:
    file: ./.secrets/solana-keeper-secret-key
  funded_router_authority_secret_key:
    file: ./.secrets/funded-router-authority-secret-key
  solana_referral_payout_secret_key:
    file: ./.secrets/solana-referral-payout-secret-key
  funded_buyback_operator_secret_key:
    file: ./.secrets/funded-buyback-operator-secret-key
  x_client_secret:
    file: ./.secrets/x-client-secret
  x_bearer_token:
    file: ./.secrets/x-bearer-token
