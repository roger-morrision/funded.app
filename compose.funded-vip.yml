# Approved Devnet target. Use with compose.preview.yml.
# Include ignored .env.deploy and .env.x so the X client ID reaches this image;
# X secrets remain in mounted .secrets files. Local Vite settings are untouched.
services:
  app:
    image: ${FUNDED_RELEASE_IMAGE:?Set the tested exact-SHA V3 image}
    build:
      args:
        VITE_DEV_MODE: "false"
        VITE_DEV_AUTOCONNECT: "false"
    environment:
      NODE_ENV: production
      DEV_MODE: "false"
      DEVNET_TEST_MODE: "false"
      FUNDED_MINT_FEE_ROUTER_ENABLED: "false"
      FUNDED_BOOST_ENABLED: "true"
      PUBLIC_APP_URL: https://funded.vip
      CORS_ORIGIN: https://funded.vip
      X_CALLBACK_URL: https://funded.vip/api/x/oauth/callback
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the tested exact source SHA}

# Keep the public app on the currently mounted, cleared Devnet data stores.
# These names were verified against the running fundedapp app and db containers.
volumes:
  funded_reward_ledger:
    name: fundedapp_funded_reward_ledger_handoff_20261012

secrets:
  database_url:
    file: ./.secrets/database-url-retest-20260929
