# Approved Devnet target. Use with compose.preview.yml.
# Include ignored .env.deploy and .env.x so the X client ID reaches this image;
# X secrets remain in mounted .secrets files. Local Vite settings are untouched.
services:
  app:
    image: ${FUNDED_APP_IMAGE:-fundedapp-app:automatic-rewards-v11-20260923h}
    build:
      args:
        VITE_DEV_MODE: "false"
        VITE_DEV_AUTOCONNECT: "false"
    environment:
      NODE_ENV: production
      DEV_MODE: "false"
      DEVNET_TEST_MODE: "false"
      # Devnet InitializeMint and SettleMint were finalized with exact claim/recipient deltas.
      FUNDED_MINT_FEE_ROUTER_ENABLED: "true"
      FUNDED_BOOST_ENABLED: "true"
      PUBLIC_APP_URL: https://funded.vip
      CORS_ORIGIN: https://funded.vip
      X_CALLBACK_URL: https://funded.vip/api/x/oauth/callback
      FUNDED_BUILD_ID: ${FUNDED_BUILD_ID:-automatic-rewards-v11-20260923h}

# Keep the public app on the active Devnet reward-worker ledger across UI releases.
volumes:
  funded_reward_ledger:
    name: fundedapp_funded_reward_ledger_retest_20260929
