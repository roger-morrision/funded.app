services:
  funded-postgres:
    image: postgres:17-alpine
    container_name: funded-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: funded_app
      POSTGRES_USER: funded
      POSTGRES_PASSWORD: funded-dev
    ports:
      - "5432:5432"
    volumes:
      - funded_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funded -d funded_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  funded_app_pgdata:
