# Optional X event worker; include with compose.devnet-release.yml only after
# configuring a dedicated user posting token. Never enabled by the default stack.
services:
  x-post-worker:
    profiles: [x-posting]
    image: ${FUNDED_APP_IMAGE:?Use the same verified image digest as the app}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    # Draft-only until an explicitly reviewed override adds --execute.
    command: [node, scripts/run-x-post-worker.mjs, --loop]
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: 'false'
      SOLANA_CLUSTER: devnet
      SOLANA_RPC_URL_FILE: /run/secrets/solana_devnet_rpc_url
      AUTOMATIC_REWARD_STORE_PATH: /app/data/automatic-rewards/ledger.json
      FUNDED_TOKEN_MINT: ${FUNDED_TOKEN_MINT:-}
      FUNDED_FEE_ROUTER_PROGRAM_ID: ${FUNDED_FEE_ROUTER_PROGRAM_ID:-}
      FUNDED_REWARD_AUTHORITY: ${FUNDED_REWARD_AUTHORITY:-}
      FUNDED_TRADE_FEE_OWNER: ${FUNDED_TRADE_FEE_OWNER:-}
      X_POST_ENABLED: ${X_POST_ENABLED:-false}
      X_POST_ALLOW_DEVNET: ${X_POST_ALLOW_DEVNET:-false}
      X_POST_EXPECTED_HANDLE: ${X_POST_EXPECTED_HANDLE:-johntrand83}
      X_POST_ACCOUNT_ID: ${X_POST_ACCOUNT_ID:-}
      X_POST_ACCESS_TOKEN_FILE: /run/secrets/x_post_access_token
      X_POST_PUBLIC_ORIGIN: ${X_POST_PUBLIC_ORIGIN:-}
      X_POST_START_AT: ${X_POST_START_AT:-}
      # Deliberately bounded in this profile; the worker also validates its limits.
      X_POST_INTERVAL_MS: '60000'
      X_POST_MAX_PER_PASS: '1'
      X_POST_MAX_HOURLY: '6'
      X_POST_MAX_DAILY: '24'
      X_POST_MIN_PROFIT_LAMPORTS: '1000000000'
    secrets: [database_url, solana_devnet_rpc_url, x_post_access_token]
    volumes:
      - devnet_app_data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

secrets:
  x_post_access_token:
    file: ${X_POST_ACCESS_TOKEN_FILE:-./.secrets/x-post-user-token}
