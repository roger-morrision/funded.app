# Clean, rollback-safe Devnet retest. Keep this overlay in every funded.vip
# Compose invocation until a reviewed data migration replaces this database.
# The secret file and Docker volume are local and never belong in Git.
services:
  app:
    image: ${FUNDED_RETEST_IMAGE:-fundedapp-app:trade-token-identity-20260930}
    environment:
      FUNDED_BUILD_ID: trade-token-identity-20260930
      FUNDED_COMMUNITY_RESERVE_RECEIPTS_JSON: '{}'
  reward-volume-init:
    image: ${FUNDED_RETEST_IMAGE:-fundedapp-app:phantom-priority-20260929}
  reward-worker:
    image: ${FUNDED_RETEST_IMAGE:-fundedapp-app:phantom-priority-20260929}
    environment:
      FUNDED_REWARD_PROGRAMS_JSON: '[]'
  fee-collector:
    image: ${FUNDED_RETEST_IMAGE:-fundedapp-app:phantom-priority-20260929}
  receipt-worker:
    image: ${FUNDED_RETEST_IMAGE:-fundedapp-app:phantom-priority-20260929}
  buyback-worker:
    image: ${FUNDED_RETEST_IMAGE:-fundedapp-app:phantom-priority-20260929}

volumes:
  funded_reward_ledger:
    name: fundedapp_funded_reward_ledger_retest_20260929

secrets:
  database_url:
    file: ./.secrets/database-url-retest-20260929
