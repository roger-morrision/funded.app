# Final public Devnet overlay. The image is built from the committed source SHA.
# Supply FUNDED_RELEASE_IMAGE and FUNDED_RELEASE_SHA from the same Git revision.
services:
  app:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    build:
      context: ${FUNDED_RELEASE_SOURCE_DIR:?Set the clean exact-SHA checkout path}
      dockerfile: Dockerfile
      args:
        FUNDED_SOURCE_REVISION: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
        VITE_FUNDED_FEE_ROUTER_PROGRAM_ID: 61EQ3onuS2jKzjUDhXdkwKNGiG8Djss3an5vPN3vwYYa
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_FEE_ROUTER_PROGRAM_ID: 61EQ3onuS2jKzjUDhXdkwKNGiG8Djss3an5vPN3vwYYa
      FUNDED_REWARD_PROGRAM_DATA_SHA256: 65993e0b50fcf6650ecaa6e8e4b23c1ff345547e55c2d7b07ead4ba81333c77d
  reward-volume-init:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  reward-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_FEE_ROUTER_PROGRAM_ID: 61EQ3onuS2jKzjUDhXdkwKNGiG8Djss3an5vPN3vwYYa
      FUNDED_REWARD_PROGRAM_DATA_SHA256: 65993e0b50fcf6650ecaa6e8e4b23c1ff345547e55c2d7b07ead4ba81333c77d
  fee-collector:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  receipt-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  buyback-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_FEE_ROUTER_PROGRAM_ID: 61EQ3onuS2jKzjUDhXdkwKNGiG8Djss3an5vPN3vwYYa
      FUNDED_REWARD_PROGRAM_DATA_SHA256: 65993e0b50fcf6650ecaa6e8e4b23c1ff345547e55c2d7b07ead4ba81333c77d
  community-claim-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_FEE_ROUTER_PROGRAM_ID: 61EQ3onuS2jKzjUDhXdkwKNGiG8Djss3an5vPN3vwYYa
      FUNDED_REWARD_PROGRAM_DATA_SHA256: 65993e0b50fcf6650ecaa6e8e4b23c1ff345547e55c2d7b07ead4ba81333c77d
