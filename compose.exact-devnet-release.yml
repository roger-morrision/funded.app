# Final public Devnet overlay. The image is built from the committed source SHA.
# Supply FUNDED_RELEASE_IMAGE and FUNDED_RELEASE_SHA from the same Git revision.
services:
  app:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    build:
      context: ${FUNDED_RELEASE_SOURCE_DIR:?Set the clean exact-SHA checkout path}
      dockerfile: Dockerfile
      args:
        FUNDED_SOURCE_REVISION: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
        VITE_FUNDED_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
      FUNDED_V3_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
      FUNDED_V3_PROGRAM_DATA_SHA256: ${FUNDED_V3_PROGRAM_DATA_SHA256:?Set the tested V3 ProgramData hash}
      FUNDED_V3_LAUNCH_ENABLED: ${FUNDED_V3_LAUNCH_ENABLED:-false}
      FUNDED_V3_COLLECTION_ENABLED: ${FUNDED_V3_COLLECTION_ENABLED:-false}
      FUNDED_V3_SETTLEMENT_ENABLED: ${FUNDED_V3_SETTLEMENT_ENABLED:-false}
      FUNDED_V3_CREATOR_REWARD_FUNDING_ENABLED: ${FUNDED_V3_CREATOR_REWARD_FUNDING_ENABLED:-false}
      FUNDED_V3_CREATOR_WALLET_PAYOUT_ENABLED: ${FUNDED_V3_CREATOR_WALLET_PAYOUT_ENABLED:-false}
      FUNDED_V3_COMMUNITY_FUNDING_ENABLED: ${FUNDED_V3_COMMUNITY_FUNDING_ENABLED:-false}
      FUNDED_V3_REFERRAL_PAYOUT_ENABLED: ${FUNDED_V3_REFERRAL_PAYOUT_ENABLED:-false}
      FUNDED_QA_COMMUNITY_CUTOFF_ENABLED: ${FUNDED_QA_COMMUNITY_CUTOFF_ENABLED:-false}
      FUNDED_QA_COMMUNITY_MINT: ${FUNDED_QA_COMMUNITY_MINT:-}
      FUNDED_QA_COMMUNITY_CUTOFF_AUTHORITY: ${FUNDED_QA_COMMUNITY_CUTOFF_AUTHORITY:-}
      FUNDED_QA_SHORT_REWARD_PERIODS: ${FUNDED_QA_SHORT_REWARD_PERIODS:-false}
      FUNDED_QA_HOLDER_MINT: ${FUNDED_QA_HOLDER_MINT:-}
      FUNDED_QA_HOLDER_MIN_LAMPORTS: ${FUNDED_QA_HOLDER_MIN_LAMPORTS:-}
      FUNDED_V3_HOLDER_WORKER_ENABLED: ${FUNDED_V3_HOLDER_WORKER_ENABLED:-false}
      FUNDED_V3_X_CLAIMS_ENABLED: ${FUNDED_V3_X_CLAIMS_ENABLED:-false}
      FUNDED_V3_BUYBACK_ENABLED: ${FUNDED_V3_BUYBACK_ENABLED:-false}
      FUNDED_V3_BUYBACK_LOOKUP_TABLE: ${FUNDED_BUYBACK_LOOKUP_TABLE:-}
      SOLANA_HOLDER_INDEX_RPC_URL_FILE: /run/secrets/solana_holder_index_rpc_url
    secrets:
      - solana_holder_index_rpc_url
  reward-volume-init:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  fee-collector:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  receipt-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  community-claim-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_V3_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
      FUNDED_V3_PROGRAM_DATA_SHA256: ${FUNDED_V3_PROGRAM_DATA_SHA256:?Set the tested V3 ProgramData hash}

secrets:
  solana_holder_index_rpc_url:
    file: ./.secrets/solana-holder-index-rpc-url
