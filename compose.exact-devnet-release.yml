# Final public Devnet overlay. The image is built from the committed source SHA.
# Supply FUNDED_RELEASE_IMAGE and FUNDED_RELEASE_SHA from the same Git revision.
services:
  app:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    build:
      context: ${FUNDED_RELEASE_SOURCE_DIR:?Set the clean exact-SHA checkout path}
      dockerfile: Dockerfile
      args:
        FUNDED_SOURCE_REVISION: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
        VITE_FUNDED_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
      FUNDED_V3_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
      FUNDED_V3_PROGRAM_DATA_SHA256: ${FUNDED_V3_PROGRAM_DATA_SHA256:?Set the tested V3 ProgramData hash}
  reward-volume-init:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  fee-collector:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  receipt-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
  community-claim-worker:
    image: ${FUNDED_RELEASE_IMAGE:?Set the exact-SHA image}
    environment:
      FUNDED_BUILD_ID: ${FUNDED_RELEASE_SHA:?Set the exact source SHA}
      FUNDED_V3_FEE_ROUTER_PROGRAM_ID: ${FUNDED_V3_FEE_ROUTER_PROGRAM_ID:?Set the approved V3 program ID}
      FUNDED_V3_PROGRAM_DATA_SHA256: ${FUNDED_V3_PROGRAM_DATA_SHA256:?Set the tested V3 ProgramData hash}
